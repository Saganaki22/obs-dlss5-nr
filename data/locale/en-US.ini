ProcessingMode="Processing Mode"
ProcessingMode.Smooth="Smooth (worker thread, variable latency)"
ProcessingMode.Realtime="Low latency (blocks the frame)"
ProcessingMode.Tip="Smooth processes frames on a worker; enhanced FPS depends on processing speed. Low latency waits for processing on the OBS render thread. Lower Processing Resolution to increase enhanced FPS. GPU sharing is only used in Low latency mode."

NRFps="NR Frame Rate"
NRFps.Source="Match source (every frame)"
NRFps.Tip="Limits how many frames per second are NR-processed. Between processed frames the last enhanced frame is displayed. Lower rates reduce GPU/CPU load."

ProcessingResolution="Processing Resolution"
ProcessingResolution.Source="Source (full resolution)"
ProcessingResolution.Tip="Resize on the GPU before neural rendering. Fits inside the selected dimensions without changing aspect ratio or enlarging smaller inputs; output retains the source size. Lower settings improve speed at the cost of detail. Default: 1080p."

Diagnostics="Diagnostic logging (restart OBS for verbose NGX logs)"
Diagnostics.Tip="Log CreateFeature parameters and module versions for troubleshooting. Enable before starting OBS to capture verbose NVIDIA NGX messages. Disabling stops forwarding immediately. Logs include local DLL paths; review them before sharing."
