name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Plugin display name
        value: ${{ jobs.windows-build.outputs.pluginName }}
      pluginVersion:
        description: Version from buildspec.json
        value: ${{ jobs.windows-build.outputs.pluginVersion }}
permissions:
  contents: read
jobs:
  windows-build:
    name: Windows x64 (all runtime-supported NVIDIA RTX GPUs)
    runs-on: windows-2022
    outputs:
      pluginName: ${{ steps.metadata.outputs.pluginName }}
      pluginVersion: ${{ steps.metadata.outputs.pluginVersion }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read version
        id: metadata
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($spec.displayName)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($spec.version)" >> $env:GITHUB_OUTPUT
      - name: Configure generic Windows x64 build
        run: cmake --preset windows-ci-x64 -DENABLE_PERFORMANCE_TESTS=ON -DENABLE_GPU_SMOKE_TEST=OFF
      - name: Build
        run: cmake --build --preset windows-x64 --config Release --parallel
      - name: Test frame pacing and NGX diagnostics
        run: ctest --test-dir build_x64 -C Release --output-on-failure
      - name: Stage plugin
        run: cmake --install build_x64 --prefix release/Release --config Release
      - name: Package Windows ZIP only
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $notes = "docs/releases/$($spec.version).md"
          if (!(Test-Path $notes)) { throw "Missing patch notes: $notes" }
          $package = "release/Release/$($spec.name)"
          Copy-Item README.md,LICENSE $package
          Copy-Item $notes "$package/PATCHNOTES.md"
          $dlls = @(Get-ChildItem $package -Recurse -Filter '*.dll')
          $allowed = @('obs-dlss5-nr.dll', 'nvngx.dll_obs.dll')
          if ($dlls.Count -ne 2 -or @($dlls | Where-Object Name -notin $allowed).Count) {
            throw 'Package must contain only the plugin and project-built caller shim DLLs.'
          }
          $zip = "release/$($spec.name)-$($spec.version)-windows-x64.zip"
          Compress-Archive -Path $package -DestinationPath $zip -CompressionLevel Optimal
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: obs-dlss5-nr-${{ steps.metadata.outputs.pluginVersion }}-windows-x64
          path: release/obs-dlss5-nr-${{ steps.metadata.outputs.pluginVersion }}-windows-x64.zip
          if-no-files-found: error
